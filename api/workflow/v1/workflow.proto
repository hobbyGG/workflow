syntax = "proto3";

package workflow.v1;

import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/hobbyGG/workflow/api/workflow/v1;v1";

// WorkflowService 提供工作流相关 API。
service WorkflowService {
  // Healthz 检查服务进程是否存活。
  rpc Healthz(WorkflowServiceHealthzRequest) returns (WorkflowServiceHealthzResponse) {
    option (google.api.http) = {get: "/live"};
  }

  // Readyz 检查服务是否可以接收请求。
  rpc Readyz(WorkflowServiceReadyzRequest) returns (WorkflowServiceReadyzResponse) {
    option (google.api.http) = {get: "/ready"};
  }

  // CreateWorkflowExecution 发起异步工作流执行。
  rpc CreateWorkflowExecution(CreateWorkflowExecutionRequest) returns (CreateWorkflowExecutionResponse) {
    option (google.api.http) = {
      post: "/internal/v1/workflow-executions"
      body: "*"
    };
  }

  // GetWorkflowExecution 查询工作流执行。
  rpc GetWorkflowExecution(GetWorkflowExecutionRequest) returns (GetWorkflowExecutionResponse) {
    option (google.api.http) = {get: "/internal/v1/workflow-executions/{workflow_execution_id}"};
  }

  // ListWorkflowExecutions 查询工作流执行列表。
  rpc ListWorkflowExecutions(ListWorkflowExecutionsRequest) returns (ListWorkflowExecutionsResponse) {
    option (google.api.http) = {get: "/internal/v1/workflow-executions"};
  }

  // ListNodeSchemas 查询画布可选节点的 schema 列表。
  rpc ListNodeSchemas(ListNodeSchemasRequest) returns (ListNodeSchemasResponse) {
    option (google.api.http) = {get: "/internal/v1/node-schemas"};
  }

  // CreateDefinition 创建工作流定义。
  rpc CreateDefinition(CreateDefinitionRequest) returns (CreateDefinitionResponse) {
    option (google.api.http) = {
      post: "/internal/v1/definitions"
      body: "*"
    };
  }

  // ListDefinitions 查询工作流定义列表。
  rpc ListDefinitions(ListDefinitionsRequest) returns (ListDefinitionsResponse) {
    option (google.api.http) = {get: "/internal/v1/definitions"};
  }

  // GetDefinition 查询工作流定义。
  rpc GetDefinition(GetDefinitionRequest) returns (GetDefinitionResponse) {
    option (google.api.http) = {get: "/internal/v1/definitions/{definition_id}"};
  }
}

message WorkflowServiceHealthzRequest {}

message WorkflowServiceHealthzResponse {}

message WorkflowServiceReadyzRequest {}

message WorkflowServiceReadyzResponse {}

message CreateWorkflowExecutionRequest {
  int64 uid = 1 [
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {
      type: "integer"
      format: "int64"
    }
  ];
  string idempotency_key = 2 [
    json_name = "idempotency_key",
    (google.api.field_behavior) = REQUIRED
  ];
  string definition_id = 3 [
    json_name = "definition_id",
    (google.api.field_behavior) = REQUIRED
  ];
  google.protobuf.Struct input = 4;
}

message CreateWorkflowExecutionResponse {
  int32 error_code = 1 [json_name = "error_code"];
  string error_msg = 2 [json_name = "error_msg"];
  int32 internal_error_code = 3 [json_name = "internal_error_code"];
  string internal_error_msg = 4 [json_name = "internal_error_msg"];
  CreateWorkflowExecutionData data = 5;
}

message CreateWorkflowExecutionData {
  string workflow_execution_id = 1 [json_name = "workflow_execution_id"];
}

message GetWorkflowExecutionRequest {
  string workflow_execution_id = 1 [json_name = "workflow_execution_id"];
}

message GetWorkflowExecutionResponse {
  int32 error_code = 1 [json_name = "error_code"];
  string error_msg = 2 [json_name = "error_msg"];
  int32 internal_error_code = 3 [json_name = "internal_error_code"];
  string internal_error_msg = 4 [json_name = "internal_error_msg"];
  WorkflowExecution data = 5;
}

message ListWorkflowExecutionsRequest {
  int64 uid = 1 [(gnostic.openapi.v3.property) = {
    type: "integer"
    format: "int64"
  }];
  string definition_type = 2 [json_name = "definition_type"];
  int32 limit = 3;
  int32 offset = 4;
}

message ListWorkflowExecutionsResponse {
  int32 error_code = 1 [json_name = "error_code"];
  string error_msg = 2 [json_name = "error_msg"];
  int32 internal_error_code = 3 [json_name = "internal_error_code"];
  string internal_error_msg = 4 [json_name = "internal_error_msg"];
  WorkflowExecutionPage data = 5;
}

message WorkflowExecutionPage {
  int32 limit = 1;
  int32 offset = 2;
  repeated WorkflowExecution workflow_executions = 4 [json_name = "workflow_executions"];
}

// WorkflowExecution 表示一次工作流执行。
message WorkflowExecution {
  string workflow_execution_id = 1 [json_name = "workflow_execution_id"];
  int64 uid = 2 [(gnostic.openapi.v3.property) = {
    type: "integer"
    format: "int64"
  }];
  string idempotency_key = 3 [json_name = "idempotency_key"];
  string definition_id = 4 [json_name = "definition_id"];
  string definition_type = 5 [json_name = "definition_type"];
  // Status 表示执行状态。
  string status = 6;
  google.protobuf.Struct input = 7;
  google.protobuf.Value output = 8;
  int32 internal_error_code = 9 [json_name = "internal_error_code"];
  string internal_error_message = 10 [json_name = "internal_error_message"];
  string failed_node_id = 11 [json_name = "failed_node_id"];
  google.protobuf.Timestamp created_at = 12 [json_name = "created_at"];
  google.protobuf.Timestamp started_at = 13 [json_name = "started_at"];
  google.protobuf.Timestamp completed_at = 14 [json_name = "completed_at"];
  google.protobuf.Timestamp updated_at = 15 [json_name = "updated_at"];
}

// ListNodeSchemasRequest 是查询画布可选节点 schema 列表的请求。
message ListNodeSchemasRequest {}

// ListNodeSchemasResponse 是查询画布可选节点 schema 列表的响应。
message ListNodeSchemasResponse {
  repeated NodeSchema node_schemas = 1 [json_name = "node_schemas"];
}

// NodeSchema 描述一种画布可选节点及其输入输出。
message NodeSchema {
  reserved 2, 3;
  reserved "inputs", "outputs";

  string type = 1;
  google.protobuf.Struct input_schema = 4 [json_name = "input_schema"];
  google.protobuf.Struct output_schema = 5 [json_name = "output_schema"];
}

message CreateDefinitionRequest {
  // UID 标识工作流定义所属用户。
  int64 uid = 1 [(gnostic.openapi.v3.property) = {
    type: "integer"
    format: "int64"
  }];
  // Name 是工作流定义的展示名称。
  string name = 2;
  // Type 标识工作流定义类型，例如 template 或 AI 工作流。
  string type = 3;
  // Definition 是需要保存的工作流图定义。
  DefinitionGraph definition = 4;
}

message CreateDefinitionResponse {
  // ErrorCode 是对外错误码。
  int32 error_code = 1 [json_name = "error_code"];
  // ErrorMsg 是对外错误信息。
  string error_msg = 2 [json_name = "error_msg"];
  // InternalErrorCode 是内部错误码。
  int32 internal_error_code = 3 [json_name = "internal_error_code"];
  // InternalErrorMsg 是内部错误信息。
  string internal_error_msg = 4 [json_name = "internal_error_msg"];
  // Data 是创建后的工作流定义。
  Definition data = 5;
}

message ListDefinitionsRequest {
  int64 uid = 1 [(gnostic.openapi.v3.property) = {
    type: "integer"
    format: "int64"
  }];
  string type = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message ListDefinitionsResponse {
  int32 error_code = 1 [json_name = "error_code"];
  string error_msg = 2 [json_name = "error_msg"];
  int32 internal_error_code = 3 [json_name = "internal_error_code"];
  string internal_error_msg = 4 [json_name = "internal_error_msg"];
  DefinitionPage data = 5;
}

message DefinitionPage {
  int32 limit = 1;
  int32 offset = 2;
  repeated Definition definitions = 4;
}

// GetDefinitionRequest 是查询工作流定义的请求。
message GetDefinitionRequest {
  string definition_id = 1 [json_name = "definition_id"];
}

message GetDefinitionResponse {
  int32 error_code = 1 [json_name = "error_code"];
  string error_msg = 2 [json_name = "error_msg"];
  int32 internal_error_code = 3 [json_name = "internal_error_code"];
  string internal_error_msg = 4 [json_name = "internal_error_msg"];
  Definition data = 5;
}

// Definition 表示工作流定义资源。
message Definition {
  // DefinitionID 是工作流定义的稳定标识。
  string definition_id = 1 [json_name = "definition_id"];
  // UID 标识工作流所属用户。
  int64 uid = 2 [(gnostic.openapi.v3.property) = {
    type: "integer"
    format: "int64"
  }];
  // Name 是工作流定义的展示名称。
  string name = 3;
  // Type 标识工作流定义类型。
  string type = 4;
  // Definition 是当前工作流图定义。
  DefinitionGraph definition = 5;
  // CreatedAt 是工作流的创建时间。
  google.protobuf.Timestamp created_at = 6 [json_name = "created_at"];
  // UpdatedAt 是工作流的更新时间。
  google.protobuf.Timestamp updated_at = 7 [json_name = "updated_at"];
}

// DefinitionGraph 表示工作流的图定义。
message DefinitionGraph {
  // Nodes 保存图中的节点定义。
  repeated Node nodes = 1;
  // Edges 保存节点之间的连线定义。
  repeated Edge edges = 2;
}

message Node {
  // ID 在当前 DefinitionGraph 内唯一，并供 Edge 引用。
  string id = 1;
  // Type 标识节点的执行类型。
  string type = 2;
  // Preset 保存节点定义中预先配置的数据。
  map<string, google.protobuf.Value> preset = 3;
}

// Edge 表示节点之间的数据依赖或控制流分支。
message Edge {
  // FromNode 是连线起点的节点 ID。
  string from_node = 1 [json_name = "from_node"];
  // FromBranch 是 Router 分支 ID，非 Router 出边为空。
  string from_branch = 2 [json_name = "from_branch"];
  // FromPort 标识源数据字段。
  string from_port = 3 [json_name = "from_port"];
  // ToNode 是连线终点的节点 ID。
  string to_node = 4 [json_name = "to_node"];
  // ToInput 标识目标节点接收数据的输入字段，控制流中留空。
  string to_input = 5 [json_name = "to_input"];
}
